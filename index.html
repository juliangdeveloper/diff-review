<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Revisa diffs de commits guardados en tu hoja de Google, conectada con Apps Script.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Diff Review</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json?v=0.2.5">
  <link rel="stylesheet" href="css/styles.css?v=0.2.5">
</head>
<body>
  <header class="bar">
    <a class="bar-btn" id="back" href="#/commits" hidden aria-label="Volver">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Volver</span>
    </a>
    <p class="bar-title" id="bar-title"></p>
    <div class="bar-end">
      <span class="demo-badge" id="demo-badge" hidden>Demo</span>
      <span class="bar-version" id="bar-version"></span>
      <button class="bar-btn icon" id="refresh" type="button" aria-label="Recargar" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.2-5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>
  <main id="view" class="view"></main>
  <nav class="tabbar" aria-label="Secciones">
    <a href="#/commits" data-route="commits">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h5.8M15.2 12H21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Commits</span>
    </a>
    <a href="#/ramas" data-route="ramas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="5" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="6" cy="19" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M6 7.2v9.6M18 9.2c0 4-4 4.5-9.5 7.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Ramas</span>
    </a>
    <a href="#/historial" data-route="historial">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Historial</span>
    </a>
    <a href="#/ajustes" data-route="ajustes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.1 3.2h3.8l.5 2.2c.5.2 1 .5 1.4.8l2.1-1 2 3.4-1.7 1.6c.1.6.1 1.1 0 1.6l1.7 1.6-2 3.4-2.1-1c-.4.3-.9.6-1.4.8l-.5 2.2h-3.8l-.5-2.2a6 6 0 0 1-1.4-.8l-2.1 1-2-3.4 1.7-1.6a6 6 0 0 1 0-1.6L4.1 8.6l2-3.4 2.1 1c.4-.3.9-.6 1.4-.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <span>Ajustes</span>
    </a>
  </nav>
  <dialog class="sheet-dialog" id="setup" aria-labelledby="setup-title">
    <div class="sheet-scroll">
      <h2 id="setup-title">Cómo preparar la hoja</h2>
      <div id="setup-body"></div>
    </div>
    <button class="btn primary" type="button" id="setup-close">Cerrar</button>
  </dialog>
  <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>
  <template id="icon-chevron"><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></template>
  <script type="module" src="js/app.js?v=0.2.5"></script>
</body>
</html>
